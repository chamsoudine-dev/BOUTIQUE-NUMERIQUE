<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: black; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .error { color: red; font-size: 0.8rem; margin-top: 10px; display: none; }
        .show-pass { font-size: 0.7rem; text-align: left; cursor: pointer; color: blue; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Admin TechNiger</h2>
        <p>Entrez le mot de passe</p>
        <input type="password" id="pass" placeholder="Mot de passe">
        <span class="show-pass" onclick="togglePass()">👁 Afficher le mot de passe</span>
        <button onclick="login()">Se connecter</button>
        <div id="err" class="error">Mot de passe incorrect !</div>
    </div>

    <script>
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash;
        }

        const SECRET_HASH = -1436154564; // Hash de TechNiger@PDG2025

        function togglePass() {
            var x = document.getElementById("pass");
            if (x.type === "password") { x.type = "text"; } else { x.type = "password"; }
        }

        function login() {
            var p = document.getElementById("pass").value;
            if (hashCode(p) === SECRET_HASH) {
                sessionStorage.setItem('techNigerAdmin', 'authenticated');
                alert("✅ Connexion réussie !");
                window.location.href = "admin.html";
            } else {
                document.getElementById("err").style.display = "block";
            }
        }
    </script>
</body>
</html>
