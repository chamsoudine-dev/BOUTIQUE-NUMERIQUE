<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin TechNiger — Publier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f4f4f4;
    --border: #e0e0e0;
    --accent2: #2189ff;
    --text: #000000;
    --muted: #757575;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: var(--bg2); padding: 32px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  h1 { font-weight: 800; font-size: 2rem; margin-bottom: 8px; text-align: center; }
  p.sub { text-align: center; color: var(--muted); margin-bottom: 32px; }
  
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 0.9rem; }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
  
  .section-title { font-weight: 800; margin: 24px 0 16px; font-size: 1.1rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
  
  .btn-publier { width: 100%; padding: 18px; background: #000; color: #fff; border: none; border-radius: 30px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: transform 0.2s, background 0.2s; margin-top: 20px; }
  .btn-publier:hover { background: #333; transform: translateY(-2px); }
  .btn-publier:disabled { background: #ccc; cursor: not-allowed; }

  .logout { display: block; text-align: center; margin-top: 20px; color: var(--muted); text-decoration: none; font-weight: 600; }
</style>

<script>
  if (sessionStorage.getItem('techNigerAdmin') !== 'authenticated') {
    window.location.href = 'admin-login.html';
  }
</script>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>⚙️ Espace PDG</h1>
    <p class="sub">Ajouter un nouvel article sur TechNiger Store</p>

    <div class="form-grid">
      <div>
        <label>Nom de l'article</label>
        <input type="text" id="p-name" placeholder="Ex: iPhone 16 Pro">
      </div>
      <div>
        <label>Marque</label>
        <input type="text" id="p-brand" placeholder="Ex: Apple">
      </div>
    </div>

    <div class="form-grid">
      <div>
        <label>Prix (FCFA)</label>
        <input type="number" id="p-price" placeholder="Ex: 950000">
      </div>
      <div>
        <label>Ancien Prix (Promo)</label>
        <input type="number" id="p-oldprice" placeholder="Ex: 1100000">
      </div>
    </div>

    <div class="section-title">📸 Photos (3 vues)</div>
    <input type="text" id="p-img-face" placeholder="Lien Photo Face" style="margin-bottom: 10px;">
    <input type="text" id="p-img-side1" placeholder="Lien Photo Profil 1" style="margin-bottom: 10px;">
    <input type="text" id="p-img-side2" placeholder="Lien Photo Profil 2">

    <div class="section-title">⚙️ Caractéristiques</div>
    <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
      <input type="text" id="p-spec-screen" placeholder="Écran">
      <input type="text" id="p-spec-battery" placeholder="Batterie">
      <input type="text" id="p-spec-storage" placeholder="Stockage">
      <input type="text" id="p-spec-ram" placeholder="RAM">
    </div>

    <div class="form-grid">
      <div>
        <label>État</label>
        <select id="p-badge">
          <option value="NEUF">✨ NEUF</option>
          <option value="OCCASION">♻️ OCCASION</option>
          <option value="PROMO">🔥 PROMO</option>
        </select>
      </div>
      <div>
        <label>Catégorie</label>
        <select id="p-cat">
          <option value="smartphones">📱 Smartphone</option>
          <option value="ordinateurs">💻 Ordinateur</option>
          <option value="televisions">📺 Télévision</option>
          <option value="montres">⌚ Montre</option>
        </select>
      </div>
    </div>

    <button id="btn-pub" onclick="publier()" class="btn-publier">🚀 PUBLIER SUR LE SITE</button>
    <a href="#" onclick="sessionStorage.clear(); window.location.reload();" class="logout">Se déconnecter</a>
  </div>
</div>

<script type="module">
  import { db, collection, addDoc } from './js/firebase-config.js';

  window.publier = async function() {
    const btn = document.getElementById('btn-pub');
    const data = {
      name: document.getElementById('p-name').value,
      brand: document.getElementById('p-brand').value,
      price: parseInt(document.getElementById('p-price').value),
      oldPrice: parseInt(document.getElementById('p-oldprice').value) || 0,
      badge: document.getElementById('p-badge').value,
      category: document.getElementById('p-cat').value,
      imgFace: document.getElementById('p-img-face').value || 'img/samsung_s24.png',
      imgSide1: document.getElementById('p-img-side1').value || 'img/side_profile.png',
      imgSide2: document.getElementById('p-img-side2').value || 'img/side_profile.png',
      specs: {
        screen: document.getElementById('p-spec-screen').value || '-',
        battery: document.getElementById('p-spec-battery').value || '-',
        storage: document.getElementById('p-spec-storage').value || '-',
        ram: document.getElementById('p-spec-ram').value || '-'
      },
      createdAt: new Date().getTime()
    };

    if(!data.name || !data.price) return alert("Veuillez remplir le nom et le prix !");

    try {
      btn.disabled = true;
      btn.innerHTML = "⏳ Publication en cours...";
      await addDoc(collection(db, "articles"), data);
      alert("✅ PRODUIT PUBLIÉ ! L'article est maintenant en ligne sur votre site.");
      
      // Afficher le bouton de partage WhatsApp
      const shareBtn = document.createElement('button');
      shareBtn.className = "btn-publier"; // On réutilise le style
      shareBtn.style.marginTop = "10px";
      shareBtn.style.background = "#25d366";
      shareBtn.style.color = "white";
      shareBtn.innerHTML = "📱 Partager sur mon Statut WhatsApp";
      
      const shareMsg = encodeURIComponent(`🔥 NOUVEAUTÉ CHEZ TECHNIGER !\n\n🚀 ${data.brand} ${data.name}\n💰 Prix : ${data.price.toLocaleString()} FCFA\n\n👉 Voir et commander ici : https://boutique-numerique.vercel.app/`);
      
      shareBtn.onclick = () => {
        window.open(`https://wa.me/?text=${shareMsg}`, '_blank');
      };

      btn.parentNode.appendChild(shareBtn);
      // window.location.reload(); // On ne recharge plus tout de suite pour laisser le temps de partager 
    } catch (e) {
      alert("❌ Erreur de publication. Assurez-vous d'avoir activé 'Firestore Database' en mode test dans votre console Firebase.");
      console.error(e);
      btn.disabled = false;
      btn.innerHTML = "🚀 PUBLIER SUR LE SITE";
    }
  }
</script>
</body>
</html>
